[project]
name = "f1terminal"
version = "0.1.0"
description = "A terminal race engineer's wall: live F1 track map, timing, strategy and history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.79",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
f1terminal = "f1terminal.__main__:main"
f1t = "f1terminal.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
